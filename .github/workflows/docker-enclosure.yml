# Place this file at: .github/workflows/docker-enclosure.yml
# Runs directly on GitHub whenever you push to frontend, backend, or database.
# Builds the Docker images into GitHub Container Registry (GHCR) and triggers n8n.

name: Build Docker Enclosure & Notify n8n

on:
  push:
    branches:
      - frontend
      - backend
      - database

permissions:
  contents: read
  packages: write

jobs:
  build-enclosure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed branch
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.ref_name == 'frontend' || github.ref_name == 'backend'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        if: github.ref_name == 'frontend' || github.ref_name == 'backend'
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LOWER}-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build & push Docker image (frontend / backend)
        if: github.ref_name == 'frontend' || github.ref_name == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

      - name: Trigger n8n to assemble & post to Hostinger
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "client_id": "${{ github.event.repository.name }}",
              "repo_owner": "${{ github.repository_owner }}",
              "repo_name": "${{ github.event.repository.name }}",
              "pushed_branch": "${{ github.ref_name }}",
              "commit_sha": "${{ github.sha }}"
            }'
